<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hitung Bangun Ruang</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="body-container">
        <h1>Bangun Ruang Counter</h1>
        <div class="card-container">
            <div class="card active" id="cardKubus" onclick="selectShape('kubus', this)">
                <img src="img/cube.png" alt="">
                <p>Kubus</p>
            </div>
            <div class="card active" id="cardKubus" onclick="selectShape('balok', this)">
                <img src="img/balok.png" alt="">
                <p>Balok</p>
            </div>
            <div class="card" onclick="selectShape('bola', this)">
                <img src="img/ball.png" alt="">
                <p>Bola</p>
            </div>
            <div class="card" onclick="selectShape('tabung', this)">
                <img src="img/tube.png" alt="">
                <p>Tabung</p>
            </div>
        </div>
        <div class="main-container">
            <div class="information">
                <img src="img/cube.png" id="img" alt="">
                <div class="info">
                    <h3 id="title"></h3>
                    <p id= "desc"></p>
                </div>
            </div>
            <div class="input" id="input"> 
                <div class="result" id="resultDisplay"></div>
                <div id="dynamicinput"></div>
                <label for="satuan">Satuan Panjang</label><br>
                <div class="menu">
                    <select name="satuan" class="satuan" id="satuan">
                        <option value="mm">mm(milimeter)</option>
                        <option value="cm">cm(centimeter)</option>
                        <option value="m">m(meter)</option>
                    </select>
                    <button onclick="Hitung()" class="hitung">Hitung Sekarang!!</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
